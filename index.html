<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>男性声優 好き顔TOP9</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">


    <!-- ==============================
         START
    =============================== -->

    <section id="start-screen" class="screen active">

      <div class="start-content">

        <div class="start-heart">♡</div>

        <p class="start-small">
          あなたの
        </p>

        <h1>
          男性声優<br>
          <span>好き顔TOP9</span>
        </h1>

        <p class="start-description">
          あなたの「好きな顔」を選んで<br>
          あなただけのTOP9を作ろう
        </p>

        <button
          id="start-button"
          class="main-button"
        >
          ♡ 予選をはじめる
        </button>

      </div>

    </section>


    <!-- ==============================
         PRELIM
    =============================== -->

    <section
      id="prelim-screen"
      class="screen"
    >

      <div class="phase-header">

        <div class="phase-title">
          🎙️ 予選
        </div>

        <div
          id="prelim-page"
          class="phase-count"
        >
          1 / 29
        </div>

      </div>


      <div class="progress-bar">
        <div
          id="prelim-progress-fill"
          class="progress-fill"
        ></div>
      </div>


      <div class="section-heading">

        <h2>
          気になる顔を選んでね♡
        </h2>

        <p>
          表示された6人の中から<br>
          最大3人まで♡
          <br>
          （0人でもOK）
        </p>

      </div>


      <div
        id="prelim-members"
        class="member-grid"
      ></div>


      <div class="button-area">

        <button
          id="prelim-skip-button"
          class="sub-button"
        >
          未選択で次へ
        </button>

        <button
          id="prelim-next-button"
          class="main-button"
        >
          ♡ 決定して次へ
        </button>

      </div>

    </section>


    <!-- ==============================
         PRELIM RESULT
    =============================== -->

    <section
      id="prelim-result-screen"
      class="screen"
    >

      <div class="result-message">

        <div class="result-emoji">
          🎉
        </div>

        <h2>
          予選終了！
        </h2>

        <p>
          174名の中から<br>
          <strong id="prelim-finalist-count">
            -
          </strong>
          名が本戦へ進出します。
        </p>

        <div
          id="prelim-finalist-number"
          class="big-number"
        >
          -
        </div>

        <p>
          ここからは2人ずつの二者択一で<br>
          あなたの「好き顔TOP9」を<br>
          決定します♡
        </p>

        <button
          id="start-battle-button"
          class="main-button"
        >
          ♡ 本戦をはじめる
        </button>

      </div>

    </section>


    <!-- ==============================
         BATTLE
    =============================== -->

    <section
      id="battle-screen"
      class="screen"
    >

      <div class="phase-header">

        <div class="phase-title">
          ⚔️ 本戦
        </div>

        <div
          id="battle-page"
          class="phase-count"
        >
          1 / 90
        </div>

      </div>


      <div class="progress-bar">
        <div
          id="battle-progress-fill"
          class="progress-fill"
        ></div>
      </div>


      <div class="section-heading">

        <h2>
          より好みの顔を1人タップしてね
        </h2>

        <p>
          直感で選んでOK♡
        </p>

      </div>


      <div
        id="battle-members"
        class="battle-members"
      ></div>


      <div class="button-area">

        <button
          id="draw-button"
          class="sub-button draw-button"
        >
          ♡ 両方好き（引き分け）
        </button>

      </div>

    </section>


    <!-- ==============================
         RESULT
    =============================== -->

    <section
      id="result-screen"
      class="screen"
    >

      <div class="final-title">

        <p>
          あなたの男性声優
        </p>

        <h2>
          好き顔TOP9
        </h2>

        <span>
          あなたが選んだ「好き」がここに♡
        </span>

      </div>


      <div
        id="top9-members"
        class="top9-grid"
      ></div>


      <div class="ranking-section">

        <h3>
          本戦順位
        </h3>

        <div
          id="ranking-list"
          class="ranking-list"
        ></div>

      </div>


      <button
        id="restart-button"
        class="main-button"
      >
        ♡ もう一度遊ぶ
      </button>

    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
