<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>男性声優 好き顔9選</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="app">

    <!-- START -->
    <section id="start-screen" class="screen">

      <div class="logo">♡</div>

      <h1>男性声優<br>好き顔9選</h1>

      <p class="lead">
        あなたの「好きな顔」を選んで<br>
        好き顔TOP9を作ろう！
      </p>

      <button id="start-button" class="main-button">
        はじめる
      </button>

    </section>


    <!-- GAME -->
    <section id="game-screen" class="screen hidden">

      <header class="game-header">

        <div>
          <span id="phase-name">予選</span>
        </div>

        <div id="progress">
          1 / 10
        </div>

      </header>


      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>


      <h2>
        好きな顔を選んでください
      </h2>


      <div id="choices" class="choices"></div>

    </section>


    <!-- RESULT -->
    <section id="result-screen" class="screen hidden">

      <div class="result-title">

        <p>あなたの</p>

        <h1>
          好き顔9選
        </h1>

        <p class="small">
          あなたが選んだ男性声優TOP9
        </p>

      </div>


      <div id="result-grid" class="result-grid"></div>


      <button id="restart-button"
              class="main-button">
        もう一度遊ぶ
      </button>

    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
